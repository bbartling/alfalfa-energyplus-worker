name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-api.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        env:
          TWIN_DATA: ${{ github.workspace }}/work/data
        run: pytest

  alfalfa-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose and check the S3 endpoint
        run: bash scripts/launch.sh config
