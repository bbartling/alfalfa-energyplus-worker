name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quickstart smoke
        run: docker compose --profile demo up --build --abort-on-container-exit --exit-code-from poster
      - name: Alfalfa compose renders an in-network S3 endpoint
        run: bash scripts/launch.sh config
