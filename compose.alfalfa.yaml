# Optional unmodified Alfalfa stack. No host ports: a reverse proxy is not
# required, and nothing here binds port 80. The twin product does not use this
# file. See README.
include:
  - path:
      - ./_alfalfa_upstream/docker-compose.yml
      - ./alfalfa.local.yaml
    project_directory: ./_alfalfa_upstream
services:
  integration:
    profiles: [verification]
    build:
      context: .
      dockerfile: Dockerfile.integration
    env_file: ./_alfalfa_upstream/.env
    volumes:
      - ./_alfalfa_upstream/tests:/alfalfa/tests:ro
    command:
      - python3
      - -m
      - pytest
      - -c
      - /dev/null
      - --rootdir=/alfalfa
      - -o
      - markers=integration:upstream integration tests
      - -v
      - --host
      - http://web
      - tests/integration/test_schedule_override.py
      - tests/integration/test_small_office_osw.py::test_io_enable_disable
  telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ALFALFA_URL: http://web
      ALFALFA_MODEL: /models/schedule_model
      TWIN_DATA: /data
    volumes:
      - twin-data:/data
      - ./_alfalfa_upstream/tests/integration/models:/models:ro
    depends_on:
      - web
    init: true
volumes:
  twin-data:
