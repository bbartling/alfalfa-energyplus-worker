[tool.ruff]
target-version = "py312"
line-length = 110
src = ["twin", "tools", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not energyplus'"
pythonpath = ["."]
markers = ["energyplus: short EnergyPlus runs in nrel/openstudio:3.9.0"]
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
