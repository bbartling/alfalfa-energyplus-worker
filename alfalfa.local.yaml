# Deployment-only overrides. The upstream Compose file is included unchanged.
services:
  web:
    image: ghcr.io/natlabrockies/alfalfa/web@sha256:061258c06a8696e24384ca4d38c0e011e908e3d0135ee53360ec70b4a49febe1
    ports: !reset []
    environment:
      S3_URL_EXTERNAL: ${S3_URL_EXTERNAL:-http://minio:9000}
  minio:
    ports: !reset []
    volumes:
      - alfalfa-s3:/data
  mongo:
    ports: !reset []
    volumes:
      - alfalfa-mongo:/data/db
  redis:
    ports: !reset []
    volumes:
      - alfalfa-redis:/data
  worker:
    image: ghcr.io/natlabrockies/alfalfa/worker@sha256:11f78f6526eb23abfc71937b1c2c31b63f034940148583afda3f38679289accf
  mc:
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 5
        mc config host add myminio http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb -p myminio/alfalfa || true
        mc anonymous set none myminio/alfalfa
volumes:
  alfalfa-s3:
  alfalfa-mongo:
  alfalfa-redis:
