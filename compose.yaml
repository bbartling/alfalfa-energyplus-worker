services:
  twin:
    build: .
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - twin-data:/data
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 2g
    cpus: 2
volumes:
  twin-data:
