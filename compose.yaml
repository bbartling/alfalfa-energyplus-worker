name: twin
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-twin}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - twin-db:/var/lib/postgresql/data
  api:
    image: twin:local
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      TWIN_ENV: ${TWIN_ENV:-prod}
      TWIN_BOOTSTRAP_KEY: ${TWIN_BOOTSTRAP_KEY:-}
      TWIN_DASHBOARD_OPEN: ${TWIN_DASHBOARD_OPEN:-0}
      TWIN_INLINE_JOBS: "1"
    ports:
      - "127.0.0.1:${TWIN_HTTP_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s
  poster:
    image: twin:local
    profiles: [demo]
    build: .
    command: ["python", "-m", "tools.fdd_sim"]
    environment:
      TWIN_API_URL: http://api:8080
      TWIN_API_KEY: ${TWIN_BOOTSTRAP_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
  worker:
    profiles: [energyplus]
    build:
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      ENERGYPLUS_BIN: /usr/local/openstudio-3.9.0/EnergyPlus/energyplus
      ENERGYPLUS_WEATHER_DIR: /var/oscli/gems/ruby/3.2.0/gems/openstudio-standards-0.7.0/data/weather
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  twin-db:
